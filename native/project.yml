name: SecondBrain
options:
  bundleIdPrefix: kr.teri.secondbrain
  developmentLanguage: ko   # 앱 기본 언어=한국어 → 시스템 UI(카메라 "다시 찍기/사용하기" 등)도 한국어로
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: "4W2HHUZTYT"   # 개인 팀(유료 Apple Developer Program 등록 — 서명 ~1년). 재생성·타 Mac에서도 자동 서명 유지.
    CODE_SIGN_STYLE: Automatic
packages:
  SecondBrainCore:
    path: SecondBrainCore
schemes:
  SecondBrainApp-iOS:
    build:
      targets:
        SecondBrainApp-iOS: all
    run:
      config: Debug
targets:
  SecondBrainApp-iOS:
    type: application
    platform: iOS
    sources: [Sources/App]
    dependencies:
      - package: SecondBrainCore
        product: SecondBrainCore
    settings:
      base:
        PRODUCT_NAME: SecondBrain
        PRODUCT_BUNDLE_IDENTIFIER: kr.teri.secondbrain
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용(사양서 §0-A: v1=Mac+iPhone, iPad는 나중). iPad 방향 경고 제거.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"   # 런치스크린 자동생성 → 전체 화면(letterbox 방지)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "새 기억을 음성으로 받아쓰기 위해 마이크를 사용합니다."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "받아쓴 음성을 이 기기에서 글로 바꾸기 위해 음성 인식을 사용합니다(외부 전송 없음)."
        INFOPLIST_KEY_NSCameraUsageDescription: "기억에 사진을 첨부하기 위해 카메라를 사용합니다. 사진은 이 기기에만 저장됩니다."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "사진에 촬영 위치를 함께 남기기 위해 위치를 사용합니다. 위치는 사진 안에만 저장되고 이 기기에만 남습니다."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  SecondBrainApp-macOS:
    type: application
    platform: macOS
    sources: [Sources/App]
    dependencies:
      - package: SecondBrainCore
        product: SecondBrainCore
    settings:
      base:
        PRODUCT_NAME: SecondBrain
        PRODUCT_BUNDLE_IDENTIFIER: kr.teri.secondbrain
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
