name: SecondBrain
options:
  bundleIdPrefix: kr.teri.secondbrain
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: "4W2HHUZTYT"   # 개인 팀(무료 Apple ID). 재생성·타 Mac에서도 자동 서명 유지.
    CODE_SIGN_STYLE: Automatic
packages:
  SecondBrainCore:
    path: SecondBrainCore
targets:
  SecondBrainApp-iOS:
    type: application
    platform: iOS
    sources: [Sources/App]
    dependencies:
      - package: SecondBrainCore
        product: SecondBrainCore
    settings:
      base:
        PRODUCT_NAME: SecondBrain
        PRODUCT_BUNDLE_IDENTIFIER: kr.teri.secondbrain
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"   # 런치스크린 자동생성 → 전체 화면(letterbox 방지)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "새 기억을 음성으로 받아쓰기 위해 마이크를 사용합니다."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "받아쓴 음성을 이 기기에서 글로 바꾸기 위해 음성 인식을 사용합니다(외부 전송 없음)."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  SecondBrainApp-macOS:
    type: application
    platform: macOS
    sources: [Sources/App]
    dependencies:
      - package: SecondBrainCore
        product: SecondBrainCore
    settings:
      base:
        PRODUCT_NAME: SecondBrain
        PRODUCT_BUNDLE_IDENTIFIER: kr.teri.secondbrain
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
