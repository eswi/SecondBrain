name: GhostLab
options:
  bundleIdPrefix: kr.teri
  deploymentTarget:
    iOS: "17.0"
targets:
  GhostLab:
    type: application
    platform: iOS
    sources:
      - Sources
      # ⚠️ 예외 하나 — **앱 파일을 랩이 함께 컴파일한다**(2026-08-21).
      # 랩 규칙은 「앱에서 랩을 참조하지 말 것」이고 이건 **반대 방향**이라 괜찮다.
      # 베껴 두면 갈린다 — 재는 것이 앱이 그리는 것과 같아야 줄바꿈 원칙을 확인할 수 있다.
      - path: ../../Sources/App/JustifiedText.swift
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: GhostLab
  GhostLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GhostLab
    dependencies:
      - target: GhostLab
schemes:
  GhostLab:
    build:
      targets:
        GhostLab: all
        GhostLabUITests: [test]
    test:
      targets: [GhostLabUITests]
