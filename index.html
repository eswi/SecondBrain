<!--
⛔⛔ 웹 v0 — **지금은 쓰지 않는 세대다** (2026-08-21 표시)
   이 저장소는 두 층이다: **웹 v0(PWA · 이 파일)** 와 **네이티브 v1(`native/`, Swift)**.
   실사용은 **네이티브 v1로 넘어갔다.** 웹 v0는 **이전 세대**이고 유지되지 않는다.
   ⛔ **열어서 쓰지 말 것** — 아래 「왜 위험한가」를 먼저 볼 것. 지우지도 말 것(표시만 해 둔다).
   세대 전체 표시 → 저장소 루트 `README.md` 맨 위 · 근거 → CLAUDE.md 항시 규칙 8

-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>세컨드 브레인 — 받은함 검토</title>
  <meta name="description" content="받은함(inbox.md)을 종류별로 분류·검색·다시보기 하는 1층 검토 앱" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#131218" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="세컨드 브레인" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="app">
    <div class="header-row">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>세컨드 브레인<span class="sub">받은함 검토</span></span>
        <span class="appver" title="빌드 버전 — 배포 확인용">v7</span>
      </div>
      <div class="header-actions">
        <button id="themeBtn" class="icon" title="테마 전환" aria-label="테마 전환">◐</button>
        <button id="reloadBtn" class="icon" title="다시 불러오기" aria-label="다시 불러오기" hidden>↻</button>
        <button id="loadBtn" class="primary" title="inbox.md 불러오기">불러오기</button>
      </div>
    </div>
    <div class="meta-line" id="metaLine"></div>
  </header>

  <main class="wrap">
    <!-- 첫 화면 / 데이터 없을 때 -->
    <div id="loaderScreen" class="loader-screen">
      <div class="empty">
        <div class="big">🧠</div>
        <h2>받은함을 불러오세요</h2>
        <p>iCloud Drive의 <code>SecondBrain/inbox.md</code>를 선택하면</p>
        <p>종류별 분류·검색·다시보기가 시작됩니다.</p>
        <p style="color:var(--text-faint);font-size:12.5px;margin-top:12px">데이터는 이 기기 안에서만 읽힙니다. 어디로도 전송되지 않아요.</p>
        <div class="cta"><button id="loadBtn2" class="primary">inbox.md 불러오기</button></div>
      </div>
    </div>

    <!-- 앱 본문 -->
    <div id="appBody" hidden>
      <section id="ambientSec" hidden>
        <div class="ambient">
          <h2 class="section-title"><span class="pill-icon">🌅</span> 오늘의 원칙</h2>
          <div id="ambientList"></div>
        </div>
      </section>

      <section id="digestSec">
        <div class="digest">
          <h2 class="section-title"><span class="pill-icon">⏰</span> 곧 닥칠 것 <span class="count" id="digestCount">0</span></h2>
          <div id="digestList" class="cards"></div>
        </div>
      </section>

      <section id="pendingSec" hidden>
        <div class="pending-box">
          <h2 class="section-title">
            <span class="pill-icon">⏳</span> 확정 대기 <span class="count" id="pendingCount">0</span>
            <button id="confirmAllBtn" class="mini primary" hidden>모두 확정</button>
          </h2>
          <p class="pending-note" id="pendingNote"></p>
          <div id="pendingList"></div>
        </div>
      </section>

      <section>
        <div class="search-box">
          <span class="search-ico">🔍</span>
          <input id="search" type="search" inputmode="search" placeholder="받은함 검색 (원문·왜·URL)" autocomplete="off" />
          <button id="clearSearch" class="clear" hidden aria-label="검색 지우기">×</button>
        </div>
        <div class="filters">
          <div class="chips" id="catChips"></div>
          <div class="chips" id="srcChips"></div>
        </div>
        <div id="listRoot"></div>
      </section>

      <p class="footnote">
        원문은 바꾸지 않습니다 · 시점(due)은 데스크톱에서만 파일에 덧붙습니다 · 폰에서 찍은 시점은 이 기기 임시(확정 대기)<br />
        상태(확인·점)는 이 기기에만 저장됩니다.
      </p>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
